<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>4th Pillar News</title>
<style>body{font-family:Arial} .card{border:1px solid #ddd;margin:10px;padding:10px;border-radius:8px} img{width:100%;height:180px;object-fit:cover} a{text-decoration:none;color:#000}</style>
</head><body>
<h1>चौथा स्तंभ न्यूज़</h1>
<div id="news"></div>
<script>
fetch('news.json').then(r=>r.json()).then(data=>{
 let h='';
 data.forEach((n,i)=>{
  h+=`<div class="card"><a href="article.html?id=${i}"><img src="${n.image}"><h3>${n.title}</h3><p>By ${n.author} | ${n.date}</p></a></div>`;
 });
 document.getElementById('news').innerHTML=h;
});
</script></body></html>
