<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News - 4th Pillar</title>
<style>
body{font-family:system-ui;background:#fff;margin:0;color:#111}
.top{background:#0b2047;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.wrap{max-width:800px;margin:auto;padding:20px}
.wrap h1{font-size:26px;line-height:1.3;margin:10px 0}
.wrap img{width:100%;border-radius:14px;margin:14px 0}
.wrap p{font-size:18px;line-height:1.9;margin-bottom:18px;text-align:justify}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.meta span{background:#fff3f3;color:#b71c1c;padding:4px 10px;border-radius:20px;border:1px solid #ffcdd2;font-size:12px}
</style>
</head>
<body>
<div class="top"><b>The Fourth Pillar News</b><a href="index.html" style="background:#fff;color:#0b2047;padding:7px 14px;border-radius:20px;text-decoration:none;font-weight:bold">बंद करें ✕</a></div>
<div class="wrap" id="box">लोड हो रहा है...</div>

<script>
function rewrite(t){
 let dict={"ने कहा":"ने बताया","कहा कि":"बताया कि","जानकारी दी":"जानकारी साझा की","के अनुसार":"के मुताबिक","बताया गया":"सामने आया","हुआ है":"हो चुका है","कर दिया":"कर दिया गया","शुरू किया":"शुरुआत की"};
 for(let k in dict){ t=t.split(k).join(dict[k]); }
 return t;
}
let id=new URLSearchParams(location.search).get('id');
fetch('./news.json').then(r=>r.json()).then(data=>{
 let n=data.find(x=>String(x.id)===String(id));
 if(!n){box.innerHTML='खबर नहीं मिली';return;}
 // To-Do: Pura para fetch + Re-arrange [1,0,2,4,3,5] + No mixing + No source
 let paras=[n.para1,n.para2,n.para3,n.para4,n.para5,n.para6,n.para7,n.para8].filter(Boolean);
 let arranged= paras.length>=6? [paras[1],paras[0],paras[2],paras[4],paras[3],paras[5]] : paras;
 let finalParas=arranged.slice(0,6).map(p=>rewrite(p));
 box.innerHTML=`
 <h1>${(n.title||'').replace(/\s*-\s*[^-]+$/,'')}</h1>
 <div class="meta"><span>लेखक: Gaurav Sharma</span><span>${n.date||''}</span><span>4th Pillar News</span></div>
 <img src="${n.image}" onerror="this.src='https://picsum.photos/seed/${n.id}/800/400'">
 ${finalParas.map(p=>`<p>${p}</p>`).join('')}
 <br><p><b>रिपोर्ट: Gaurav Sharma, 4th Pillar News</b></p>`;
});
</script>
</body>
</html>
