<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>News Detail</title><style>body{font-family:Arial;background:#f4f6f9;margin:0;padding:15px}.box{max-width:800px;margin:auto;background:#fff;padding:20px;border-radius:10px}img{max-width:100%}</style></head><body><div class="box"><a href="news.html">← Back</a><h1 id="title"></h1><p id="desc"></p></div><script>const p=new URLSearchParams(location.search);const id=p.get('id');fetch('news.json').then(r=>r.json()).then(d=>{const n=d[id];document.getElementById('title').innerText=n.title;document.getElementById('desc').innerText=n.desc;});</script></body></html>
