<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fourth Pillar News - Gaurav Sharma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f0f2f5;color:#111}
.top{background:#0b2047;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;position:sticky;top:0;z-index:100}
.top-left{display:flex;align-items:center;gap:12px}
.top img{width:52px;height:52px;border-radius:10px;background:#fff;object-fit:cover}
.top h1{color:#fff;font-size:19px;line-height:1.1}
.top h1 b{color:#f2c14e;font-size:11px;display:block;font-weight:600}
.search{padding:8px 14px;border-radius:20px;border:0;width:180px}
.cats{background:#fff;display:flex;gap:8px;overflow:auto;padding:10px;border-bottom:1px solid #ddd}
.cats span{background:#eef2ff;padding:6px 14px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:16px;max-width:1300px;margin:auto}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card img{width:100%;height:200px;object-fit:cover}
.c{padding:14px}
.c h3{font-size:17px;line-height:1.35;margin-bottom:10px}
.c a{color:#b71c1c;font-weight:800;text-decoration:none}
.meta{font-size:11px;color:#666;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.meta span{background:#fff3f3;border:1px solid #ffcdd2;padding:3px 8px;border-radius:20px}
</style>
</head>
<body>
<div class="top">
<div class="top-left">
<img src="the4thpillarnews.jpg" onerror="this.src='https://iili.io/FxLxV5J.png'">
<h1>The Fourth Pillar News<b>Sach Ka Chautha Stambh | Gaurav Sharma</b></h1>
</div>
<input id="search" class="search" placeholder="खोजें...">
</div>
<div class="cats"><span>सभी</span><span>भारत</span><span>राजनीति</span><span>क्राइम</span><span>टेक्नोलॉजी</span></div>
<div id="grid" class="grid"></div>

<script>
let allNews=[];
fetch('./news.json').then(r=>r.json()).then(data=>{
 allNews=data.filter(n=>n.para1 && n.image).reverse();
 render(allNews);
});
function render(list){
 let html='';
 list.forEach(n=>{
  let t=(n.title||'').replace(/\s*-\s*[^-]+$/,'');
  html+=`<div class="card"><img src="${n.image}" loading="lazy" onerror="this.src='https://picsum.photos/seed/${n.id}/400/220'"><div class="c"><div class="meta"><span>Gaurav Sharma</span><span>${n.date||''}</span></div><h3>${t}</h3><a href="news.html?id=${n.id}">पूरी खबर पढ़ें →</a></div></div>`;
 });
 document.getElementById('grid').innerHTML=html;
}
document.getElementById('search').addEventListener('input',e=>{
 let q=e.target.value.toLowerCase();
 render(allNews.filter(n=>n.title.toLowerCase().includes(q)));
});
</script>
</body>
</html>
