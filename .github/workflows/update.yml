name: Auto News Update
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install feedparser
      - run: python bot.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add index.html
          git commit -m "auto hindi news" || true
          git push
