<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Pillar News - Reporter Gaurav Sharma</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#b91c1c;color:#fff;padding:15px;text-align:center;position:sticky;top:0}
.cat-bar{background:#fff;padding:10px;text-align:center}
.cat-bar button{margin:4px;padding:7px 12px;border:1px solid #b91c1c;background:#fff;color:#b91c1c;border-radius:20px}
.card{background:#fff;margin:12px;border-radius:10px;overflow:hidden;box-shadow:0 2px 5px #0001}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:12px}
.card-body h3{margin:0 0 5px;font-size:18px;color:#111}
.meta{font-size:12px;color:#666}
.read{display:block;background:#b91c1c;color:#fff;text-align:center;padding:10px;margin:10px;border-radius:5px;text-decoration:none}
#detail{background:#fff;min-height:100vh;padding:15px;display:none}
#detail img{width:100%;border-radius:10px}
</style>
</head>
<body>
<header><h2>4th PILLAR NEWS</h2><small>Reporter: Gaurav Sharma | Ghaziabad</small></header>

<div id="list-view">
<div class="cat-bar">
<button onclick="loadCat('All')">All</button>
<button onclick="loadCat('National')">National</button>
<button onclick="loadCat('International')">International</button>
<button onclick="loadCat('Sports')">Sports</button>
<button onclick="loadCat('Ghaziabad')">Ghaziabad</button>
</div>
<div id="news-list"></div>
</div>

<div id="detail"></div>

<script>
let allData=[];
fetch('news.json').then(r=>r.json()).then(data=>{
allData=data;
showList(data);
let id=new URLSearchParams(location.search).get('id');
if(id!=null) showDetail(id);
});

function showList(data){
let html='';
data.forEach(n=>{
html+=`<div class="card">
<img src="${n.image}"><div class="card-body">
<h3>${n.title}</h3><div class="meta">${n.category} | ${n.date} | Reporter: ${n.reporter}</div>
<a class="read" href="?id=${n.id}" onclick="showDetail(${n.id});return false;">Puri Khabar Padhein</a>
</div></div>`;
});
document.getElementById('news-list').innerHTML=html;
}
function loadCat(cat){
if(cat=='All') showList(allData);
else showList(allData.filter(x=>x.category==cat));
}
function showDetail(id){
let n=allData.find(x=>x.id==id);
if(!n) return;
document.getElementById('list-view').style.display='none';
let d=document.getElementById('detail');
d.style.display='block';
d.innerHTML=`<a href="./" style="color:#b91c1c">← Wapas</a>
<h1>${n.title}</h1>
<div class="meta">${n.category} | ${n.date} | Reporter: ${n.reporter}</div>
<img src="${n.image}"><br><br>
<p>${n.para1}</p><p>${n.para2}</p><p>${n.para3}</p><p>${n.para4}</p><p>${n.para5}</p><p>${n.para6}</p><p>${n.para7}</p>
<br><a href="./" style="display:block;background:#b91c1c;color:#fff;text-align:center;padding:12px;text-decoration:none;border-radius:5px">← Sabhi Khabrein</a>`;
window.scrollTo(0,0);
}
</script>
</body>
</html>
