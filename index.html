<script>
let newsList=[];
async function loadDirect(){
let listEl=document.getElementById('list');
let ok=false;

// TRY 1: DIRECT BBC SITE
try{
let proxy=`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.bbc.com/hindi')}`;
let res=await fetch(proxy,{signal:AbortSignal.timeout(5000)});
let data=await res.json();
let doc=new DOMParser().parseFromString(data.contents,'text/html');
let links=[...doc.querySelectorAll('a[href*="/hindi/articles/"]')];
let map=new Map();
links.forEach(a=>{
 let href=a.href.startsWith('http')?a.href:'https://www.bbc.com'+a.getAttribute('href');
 let title=a.innerText.trim();
 if(title.length>20 &&!map.has(href)) map.set(href,title);
});
newsList=[...map.entries()].slice(0,12).map(([link,title])=>({link,title,content:''}));
if(newsList.length>3) ok=true;
}catch(e){}

if(!ok){
// TRY 2: RSS via ALLORIGINS (ye India me chalta hai)
try{
let proxy2=`https://api.allorigins.win/get?url=${encodeURIComponent('https://feeds.bbci.co.uk/hindi/rss.xml')}`;
let res2=await fetch(proxy2,{signal:AbortSignal.timeout(5000)});
let data2=await res2.json();
let doc2=new DOMParser().parseFromString(data2.contents,'text/xml');
let items=[...doc2.querySelectorAll('item')];
newsList=items.slice(0,12).map(it=>({
 title:it.querySelector('title').textContent,
 link:it.querySelector('link').textContent,
 content:it.querySelector('description').textContent
}));
if(newsList.length>0) ok=true;
}catch(e){}
}

if(!ok){
// TRY 3: RSS2JSON LAST
try{
let r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://feeds.bbci.co.uk/hindi/rss.xml'));
let j=await r.json();
newsList=j.items.slice(0,12).map(it=>({title:it.title,link:it.link,content:it.content||it.description}));
ok=true;
}catch(e){}
}

if(!ok){
 listEl.innerHTML='<p style="text-align:center;padding:20px">Net slow hai, <button onclick="loadDirect()">Retry</button> dabao</p>';
 return;
}
renderList();
}

function renderList(){
let list=document.getElementById('list'); list.innerHTML='';
newsList.forEach((it,i)=>{
 let d=document.createElement('div'); d.className='card';
 d.innerHTML=`<h2>${it.title}</h2><div class="meta"><span>लेखक: Gaurav Sharma</span></div><p style="color:#b71c1c;font-weight:bold;margin-top:8px">पूरी खबर पढ़ें →</p>`;
 d.onclick=()=>openN(i);
 list.appendChild(d);
});
}

async function openN(i){
let it=newsList[i];
let body=document.getElementById('mbody');
document.getElementById('modal').style.display='block';
body.innerHTML=`<h1>${it.title}</h1><p>पूरा आर्टिकल लाया जा रहा है...</p>`;
let paras=[];
try{
let proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(it.link)}`;
let res=await fetch(proxy);
let data=await res.json();
let doc=new DOMParser().parseFromString(data.contents,'text/html');
paras=[...doc.querySelectorAll('main p, article p, div[data-component="text-block"] p')].map(p=>p.innerText.trim()).filter(t=>t.length>50 &&!t.toLowerCase().includes('bbc'));
paras=[...new Set(paras)];
}catch(e){
let clean=(it.content||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
paras=clean.split('।').map(s=>s.trim()).filter(s=>s.length>40);
}
let arranged = paras.length>=6? [paras[1],paras[0],paras[2],paras[4],paras[3],paras[5]] : paras;
arranged = arranged.slice(0,6).map(p=>p.replace('ने कहा','ने बताया').replace('के अनुसार','के मुताबिक'));
body.innerHTML=`
<h1>${it.title}</h1>
<div class="meta"><span>लेखक: Gaurav Sharma</span><span>4th Pillar News</span></div>
${arranged.map(p=>`<p>${p}।</p>`).join('')}
<br><p><b>रिपोर्ट: Gaurav Sharma</b></p>
`;
}
loadDirect();
</script>
