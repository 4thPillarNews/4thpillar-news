name: Auto News Update

on:
  schedule:
    - cron: '30 1 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run Bot
        run: python bot.py
      - name: Save News
        run: |
          git config --global user.name '4thPillar Bot'
          git config --global user.email 'bot@4thpillar.com'
          git add news.json
          git commit -m "Auto update news" || echo "No changes"
          git push
