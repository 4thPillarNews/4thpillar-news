<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fourth Pillar News</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f6f7f9;padding-bottom:20px}
.header{background:#0b2047;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.logo{width:42px;height:42px;background:#f2c14e;color:#0b2047;font-weight:900;display:flex;align-items:center;justify-content:center;border-radius:8px}
.card{background:#fff;margin:12px auto;border-radius:14px;overflow:hidden;max-width:760px;box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer}
.card-img{height:190px;position:relative}.card-img img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;background:#1e3a8a;color:#fff;padding:3px 10px;border-radius:20px;font-size:11px}
.card-body{padding:12px}.card-body h3{font-size:15.5px;line-height:1.4}
.meta{font-size:11px;color:#888;margin-top:6px;display:flex;gap:10px}
</style>
</head>
<body>
<div class="header"><div class="logo">4P</div><div><b>The Fourth Pillar News</b><div style="font-size:10px;color:#f2c14e">Gaurav Sharma • Ghaziabad • Live</div></div></div>
<div id="list" style="text-align:center;padding:40px">खबरें लोड हो रही हैं...</div>
<script>
async function load(){
 let el=document.getElementById('list');
 try{
  let r=await fetch('./news.json?v='+Date.now());
  let data=await r.json();
  data.sort((a,b)=> (b.id||0)-(a.id||0));
  localStorage.setItem('4p_all',JSON.stringify(data));
  el.innerHTML=data.map((n,i)=>`
   <div class="card" onclick="location.href='news.html?id=${n.id}'">
    <div class="card-img"><span class="tag">${n.category||'ताजा'}</span><img src="${n.image||n.img||'https://picsum.photos/seed/4pillar/800/500'}" loading="lazy"></div>
    <div class="card-body"><h3>${n.title}</h3><div class="meta"><span>📅 ${n.date||n.dateStr||''}</span><span>✍️ ${n.reporter||'Gaurav Sharma'}</span><span>📍 ${n.location||''}</span></div></div>
   </div>`).join('');
 }catch(e){ el.innerHTML='Error: news.json load nahi hui<br>'+e.message; }
}
load();
</script>
</body>
</html>
