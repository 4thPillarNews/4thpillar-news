<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>The 4th Pillar News</title><style>body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0}header{background:#111;color:#fff;padding:12px;display:flex;align-items:center;gap:10px}header img{height:45px}.container{max-width:900px;margin:auto;padding:15px}.card{background:#fff;padding:15px;margin-bottom:15px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1);cursor:pointer}.card h2{margin:0 0 8px;font-size:19px}.card p{color:#444;font-size:14px}footer{text-align:center;padding:15px;background:#fff}footer a{margin:0 8px;color:#111;text-decoration:none}</style></head><body><header><img src="the4thpillarnews.jpg"><div><b>The 4th Pillar News</b></div></header><div class="container"><div id="news">Loading...</div></div><footer><a href="about.html">About</a></footer><script>fetch('news.json').then(r=>r.json()).then(d=>{let h='';d.forEach((n,i)=>{let s=(n.desc||'').substring(0,150)+'...';h+=`<div class="card" onclick="location.href='news-detail.html?id=${i}'"><h2>${n.title}</h2><p>${s}</p></div>`});document.getElementById('news').innerHTML=h});</script></body></html>
