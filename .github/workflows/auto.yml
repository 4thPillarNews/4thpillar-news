name: update
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install feedparser beautifulsoup4 requests lxml
      - run: python news.py
      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add news.json
          git commit -m "update news" || exit 0
          git push
