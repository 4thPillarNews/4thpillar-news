<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>News Detail</title>
<style>body{font-family:Arial;padding:15px;max-width:700px;margin:auto} img{width:100%;border-radius:8px}</style>
</head><body>
<a href="index.html">← Back</a>
<div id="detail"></div>
<script>
const id = new URLSearchParams(window.location.search).get('id') || 0;
fetch('news.json').then(r=>r.json()).then(data=>{
 let n = data[id];
 if(!n){ document.getElementById('detail').innerHTML='News not found'; return; }
 let paras = (n.description || '').split('\n').map(p=>`<p>${p}</p>`).join('');
 document.getElementById('detail').innerHTML = `
  <h1>${n.title}</h1>
  <p><b>By ${n.author || 'Gaurav Sharma'} | ${n.date || ''}</b></p>
  <img src="${n.image}">
  <div>${paras}</div>
 `;
});
</script></body></html>
