<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News Detail</title>
<style>body{font-family:system-ui;max-width:800px;margin:auto;background:#fff;padding:0}.top{background:#0b2047;color:#fff;padding:12px} a{color:#fff;text-decoration:none}.content{padding:16px}.content h1{font-size:22px;line-height:1.3;margin-bottom:12px}.content img{width:100%;border-radius:12px;margin:12px 0}.content p{margin-bottom:16px;font-size:17px;text-align:justify;line-height:1.8}</style></head><body>
<div class="top"><a href="index.html">← Back to Home</a></div><div id="detail" class="content">Loading...</div>
<script>
function rewrite(t){return t.replace(/ने कहा/g,'ने बताया').replace(/BBC/g,'');}
let id=new URLSearchParams(location.search).get('id');
let n=JSON.parse(localStorage.getItem('4p_'+id)||'null');
if(!n){document.getElementById('detail').innerHTML='Home से दोबारा खोलें';}else{
let paras=n.content.split('।').filter(s=>s.length>20);
let arranged=paras.length>=6?[paras[1],paras[0],paras[2],paras[4],paras[3],paras[5]]:paras;
document.getElementById('detail').innerHTML=`<h1>${n.title}</h1><small>By Gaurav Sharma • आज</small><img src="${n.img}">${arranged.map(p=>`<p>${rewrite(p)}।</p>`).join('')}<br><b>रिपोर्ट: Gaurav Sharma, 4th Pillar News</b>`;
}
</script></body></html>
