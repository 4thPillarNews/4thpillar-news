<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Pillar News - Gaurav Sharma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f5f5;line-height:1.9;color:#111}
.top{background:#0b2047;display:flex;align-items:center;padding:10px 14px;gap:12px;position:sticky;top:0;z-index:10}
.top img{width:52px;height:52px;border-radius:10px;background:#fff;object-fit:cover}
.top h1{color:#fff;font-size:18px;line-height:1.1}
.top h1 b{color:#f2c14e;font-size:11px;display:block;margin-top:3px}
.card{background:#fff;margin:12px auto;padding:18px;border-radius:12px;max-width:800px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.meta{font-size:12px;color:#666;margin:8px 0;display:flex;gap:8px;flex-wrap:wrap}
.meta span{background:#fff3f3;color:#b71c1c;padding:3px 10px;border-radius:20px;border:1px solid #ffcdd2}
.read{color:#b71c1c;font-weight:bold;cursor:pointer;margin-top:10px;display:inline-block}
#modal{display:none;position:fixed;inset:0;background:#fff;z-index:100;overflow:auto}
#mhead{background:#0b2047;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0}
#mbody{padding:20px;max-width:800px;margin:auto}
#mbody p{margin-bottom:16px;font-size:17px;text-align:justify}
</style>
</head>
<body>
<div class="top">
<img src="the4thpillarnews.jpg" onerror="this.src='https://iili.io/FxLxV5J.png'">
<h1>The Fourth Pillar News<b>Sach Ka Chautha Stambh | Gaurav Sharma</b></h1>
</div>
<div id="list"><p style="text-align:center;padding:40px">लोड हो रहा है...</p></div>
<div id="modal"><div id="mhead"><b>4th Pillar News</b><button onclick="modal.style.display='none'" style="background:#fff;color:#0b2047;border:0;padding:6px 14px;border-radius:20px;font-weight:bold">बंद करें ✕</button></div><div id="mbody"></div></div>

<script>
let all=[];
async function load(){
let r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://feeds.bbci.co.uk/hindi/rss.xml'));
let j=await r.json(); all=j.items;
let list=document.getElementById('list'); list.innerHTML='';
all.forEach((it,i)=>{
let d=document.createElement('div'); d.className='card';
d.innerHTML=`<h2>${it.title}</h2><div class="meta"><span>लेखक: Gaurav Sharma</span><span>${new Date(it.pubDate).toLocaleDateString('hi-IN')}</span></div><p>${it.description.replace(/<[^>]*>/g,'').substring(0,180)}...</p><span class="read" onclick="openN(${i})">पूरी खबर पढ़ें →</span>`;
list.appendChild(d);
});
}

function rewriteSafe(t){
let m={"ने कहा":"ने बताया","कहा कि":"बताया कि","जानकारी दी":"जानकारी साझा की","के अनुसार":"के मुताबिक","बताया गया":"सामने आया","मौजूद":"उपस्थित"};
for(let k in m){ if(t.includes(k)) return t.replace(k,m[k]); }
return t;
}

function make6Para(text){
let sents=text.replace(/<[^>]*>/g,'').split('।').map(s=>s.trim()).filter(s=>s.length>20);
if(sents.length<6){
 let words=text.replace(/<[^>]*>/g,'').split(' ');
 let chunk=Math.ceil(words.length/6);
 let p=[];
 for(let k=0;k<6;k++){ let t=words.slice(k*chunk,(k+1)*chunk).join(' ').trim(); if(t) p.push(t); }
 sents=p;
}
let arranged=sents.length>=6?[sents[1],sents[0],sents[2],sents[3],sents[4],sents[5]]:sents;
return arranged.slice(0,6).map(p=>rewriteSafe(p));
}

async function openN(i){
let it=all[i];
document.getElementById('modal').style.display='block';

// STEP 1: TURANT DIKHAO - KHABAR GAYAB NAHI HOGI
let instant=make6Para(it.content+" "+it.description);
document.getElementById('mbody').innerHTML=`
<h1>${it.title}</h1>
<div class="meta"><span>लेखक: Gaurav Sharma</span><span>4th Pillar News</span></div>
<p><b>क्या हुआ:</b> ${instant[0]||''}।</p>
<p><b>कब हुआ:</b> ${instant[1]||''}।</p>
<p><b>कैसे हुआ:</b> ${instant[2]||''}।</p>
<p><b>क्यों हुआ:</b> ${instant[3]||''}।</p>
<p>${instant[4]||''}।</p>
<p>${instant[5]||''}।</p>
<br><p><b>रिपोर्ट: Gaurav Sharma, 4th Pillar News</b></p>
`;

// STEP 2: BACKGROUND ME PURA ARTICLE TRY KARO - MILE TO UPDATE
try{
let proxy='https://api.allorigins.win/get?url='+encodeURIComponent(it.link);
let res=await Promise.race([fetch(proxy), new Promise((_,r)=>setTimeout(()=>r('timeout'),3500))]);
if(!res.json) throw 'timeout';
let data=await res.json();
let doc=new DOMParser().parseFromString(data.contents,'text/html');
let raw=[...doc.querySelectorAll('main p, article p, div[data-component="text-block"]')].map(p=>p.innerText.trim()).filter(t=>t.length>45 &&!t.includes('BBC'));
raw=[...new Set(raw)];
if(raw.length>=4){
 let arranged=[raw[1],raw[0],raw[2],raw[3],raw[4],raw[5]].slice(0,6).map(p=>rewriteSafe(p));
 document.getElementById('mbody').innerHTML=`
 <h1>${it.title}</h1>
 <div class="meta"><span>लेखक: Gaurav Sharma</span><span>Full Article Verified</span></div>
 <p><b>क्या हुआ:</b> ${arranged[0]||''}</p>
 <p><b>कब हुआ:</b> ${arranged[1]||''}</p>
 <p><b>कैसे हुआ:</b> ${arranged[2]||''}</p>
 <p><b>क्यों हुआ:</b> ${arranged[3]||''}</p>
 <p>${arranged[4]||''}</p>
 <p>${arranged[5]||''}</p>
 <br><p><b>रिपोर्ट: Gaurav Sharma, 4th Pillar News</b></p>
 `;
}
}catch(e){}
}
load();
</script>
</body>
</html>
