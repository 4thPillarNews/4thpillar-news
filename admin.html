
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - 4th Pillar</title>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:10px}
.card{background:#222;padding:12px;margin-bottom:15px;border-radius:8px;border:1px solid #333}
input,textarea{width:100%;padding:8px;margin:5px 0;background:#000;color:#fff;border:1px solid #444;border-radius:5px}
button{padding:10px 15px;border:none;border-radius:5px;font-weight:bold;margin:2px}
.btn-save{background:#0f0;color:#000}.btn-del{background:#f00;color:#fff}.btn-add{background:#00f;color:#fff;width:100%;margin-top:10px}
img{max-width:100%;height:150px;object-fit:cover}
</style>
</head>
<body>
<h2>4th Pillar Admin</h2>
<button class="btn-add" onclick="addNews()">+ Nayi Khabar Jodo</button>
<button class="btn-add" style="background:green" onclick="downloadJSON()">DOWNLOAD news.json</button>
<div id="list">Loading...</div>
<script>
let newsData = [];
fetch('news.json').then(r=>r.json()).then(data=>{newsData=data;render();});
function render(){
  let html='';
  newsData.forEach((n,i)=>{
    html+=`<div class="card"><img src="${n.image}"><input id="t${i}" value="${n.title.replace(/"/g,'&quot;')}"><input id="img${i}" value="${n.image}"><textarea id="p1${i}" rows="4">${n.para1}</textarea><textarea id="p2${i}" rows="4">${n.para2}</textarea><button class="btn-save" onclick="save(${i})">Save</button><button class="btn-del" onclick="del(${i})">Delete</button></div>`;
  });
  document.getElementById('list').innerHTML=html;
}
function save(i){newsData[i].title=document.getElementById(`t${i}`).value;newsData[i].image=document.getElementById(`img${i}`).value;newsData[i].para1=document.getElementById(`p1${i}`).value;newsData[i].para2=document.getElementById(`p2${i}`).value;alert('Save ho gaya, ab DOWNLOAD dabao');}
function del(i){if(confirm('Delete?')){newsData.splice(i,1);render();}}
function addNews(){newsData.unshift({id:Date.now(),title:"Nayi Khabar",para1:"Para1",para2:"Para2",para3:"",para4:"",image:"https://picsum.photos/seed/new/800/450",link:"article.html?id=0",category:"Latest",date:new Date().toLocaleDateString(),reporter:"Gaurav Sharma",source:"4th Pillar News"});render();}
function downloadJSON(){let blob=new Blob([JSON.stringify(newsData,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='news.json';a.click();}
</script>
</body>
</html>
