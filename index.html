<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 4th Pillar News - Gaurav Sharma</title>
<style>
body{font-family:Arial; margin:0; background:#f4f4f4;}
header{background:#000; color:#fff; padding:15px; text-align:center; font-size:22px; font-weight:bold;}
.container{max-width:800px; margin:20px auto; padding:10px;}
.card{background:#fff; padding:15px; margin-bottom:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.card h2{margin:0 0 10px 0; font-size:18px;}
.card small{color:gray;}
</style>
</head>
<body>
<header>THE 4TH PILLAR NEWS</header>
<div class="container" id="news-container">Loading...</div>

<script>
fetch('news.json')
.then(res => res.json())
.then(news => {
  let html = "";
  for(let i=0; i<news.length; i++){
    let n = news[i];
    html += `<div class="card">
      <h2>${n.title}</h2>
      <p>${n.desc}</p>
      <small>By ${n.author} | ${n.date}</small>
    </div>`;
  }
  document.getElementById('news-container').innerHTML = html;
});
</script>
</body>
</html>
