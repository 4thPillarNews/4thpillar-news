<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>पूरी खबर</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui; background:#fff; line-height:1.7; word-wrap:break-word; overflow-wrap:anywhere}
.top{background:#0a1f44;color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
.top img{width:40px;height:40px;border-radius:8px;background:#fff}
.box{max-width:800px;margin:auto;padding:14px}
.box img{width:100%;height:auto;border-radius:12px;margin:12px 0}
.box h1{font-size:20px;line-height:1.4;margin-top:10px}
.box p{font-size:15.5px;color:#222;margin:14px 0;text-align:justify}
</style>
</head>
<body>
<div class="top"><img src="the4thpillarnews.jpg"><b>द फोर्थ पिलर न्यूज़</b></div>
<div class="box" id="box">लोड हो रहा है...</div>
<script>
let id=new URLSearchParams(location.search).get('id')||0;
fetch('./news.json?v='+Date.now()).then(r=>r.json()).then(d=>{
 let n=d[id];
 let paras=(n.content||n.desc||'').split('\n\n');
 let pHtml=paras.map(p=>`<p>${p}</p>`).join('');
 document.getElementById('box').innerHTML=`<a href="index.html" style="text-decoration:none">← मुख्य पेज</a><h1>${n.title}</h1><small>${n.date}</small><img src="${n.image}">${pHtml}<hr><small>© By Gaurav Sharma - 4thPillar News</small>`;
});
</script>
</body>
</html>
