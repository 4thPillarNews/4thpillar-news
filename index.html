<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The 4th Pillar News - Gaurav Sharma</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Devanagari',sans-serif;background:#f4f4f4;color:#111}
header{background:#000;color:#fff;padding:14px;text-align:center;font-size:20px;font-weight:700;position:sticky;top:0;z-index:10}
.container{max-width:700px;margin:0 auto;padding:10px}
.cat{display:inline-block;background:#d32f2f;color:#fff;font-size:11px;padding:3px 8px;border-radius:12px;margin-bottom:8px}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h2{font-size:17px;line-height:1.5;margin-bottom:6px}
.card p{font-size:14px;color:#444;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:#888;font-size:12px}
#details{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;overflow-y:auto;display:none;z-index:99}
#details.inner{max-width:700px;margin:0 auto;padding:16px}
#details h1{font-size:22px;line-height:1.4;margin:12px 0}
#details.meta{color:#666;font-size:13px;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:10px}
#details.content p{font-size:17px;line-height:1.9;margin-bottom:14px;text-align:left;color:#222;white-space:pre-wrap}
#details button{padding:10px 18px;background:#000;color:#fff;border:0;border-radius:8px;margin-bottom:12px}
</style>
</head>
<body>
<header>THE 4TH PILLAR NEWS</header>
<div class="container" id="news-container">Loading...</div>
<div id="details"><div class="inner" id="details-inner"></div></div>
<script>
let allNews=[];
fetch('news.json?v='+Date.now()).then(r=>r.json()).then(news=>{
  allNews=news;
  let html="";
  for(let i=0;i<news.length;i++){
    let c=news[i].category||"खबर";
    html+=`<div class="card" onclick="openNews(${i})"><span class="cat">${c}</span><h2>${news[i].title}</h2><p>${news[i].desc}</p><small>By ${news[i].author} | ${news[i].date}</small></div>`;
  }
  document.getElementById('news-container').innerHTML=html;
});
function openNews(i){
  let n=allNews[i];
  let paras=n.desc.split('\n\n').map(p=>`<p>${p}</p>`).join('');
  document.getElementById('details-inner').innerHTML=`<button onclick="document.getElementById('details').style.display='none'">← वापस</button><span class="cat">${n.category||'खबर'}</span><h1>${n.title}</h1><div class="meta">By ${n.author} | ${n.date}</div><div class="content">${paras}</div>`;
  document.getElementById('details').style.display='block';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
