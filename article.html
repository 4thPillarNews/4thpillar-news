<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Pillar News</title>
<style>
body{margin:0;font-family:Arial;background:#fff}
.top{background:#b30000;padding:12px}
.top a{color:#fff;text-decoration:none;font-weight:bold}
.box{max-width:700px;margin:auto;padding:15px}
.box img{width:100%;border-radius:8px;margin:10px 0}
.box p{font-size:17px;line-height:1.7;color:#222}
.meta{color:gray;font-size:14px;margin:10px 0}
</style>
</head>
<body>
<div class="top"><a href="index.html">← Back to Home</a></div>
<div class="box" id="detail">Loading...</div>
<script>
let id = parseInt(new URLSearchParams(window.location.search).get('id') || 0);
fetch('news.json?v='+Date.now()).then(r=>r.json()).then(data=>{
  let n = data.find(x => x.id == id);
  if(!n) n = data[0];
  document.getElementById('detail').innerHTML = `
    <h1>${n.title}</h1>
    <div class="meta"><b>${n.category}</b> | ${n.date} | By ${n.reporter} | ${n.source}</div>
    <img src="${n.image}" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800'">
    <p>${n.para1 || ''}</p>
    <p>${n.para2 || ''}</p>
    <p>${n.para3 || ''}</p>
    <p>${n.para4 || ''}</p>
    <p>${n.para5 || ''}</p>
    <p>${n.para6 || ''}</p>
    <p><a href="${n.link}" target="_blank" style="color:#b30000">Original Source dekhein</a></p>
  `;
});
</script>
</body>
</html>
