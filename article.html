<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News</title>
<style>
body{margin:0;font-family:Arial;background:#fff}
.top{background:#b30000;padding:12px}
.top a{color:#fff;text-decoration:none}
.box{max-width:700px;margin:auto;padding:15px}
.box img{width:100%;border-radius:8px;margin:10px 0}
.box p{font-size:17px;line-height:1.7}
</style>
</head>
<body>
<div class="top"><a href="index.html">← Back</a></div>
<div class="box" id="detail">Loading...</div>
<script>
let id = new URLSearchParams(window.location.search).get('id') || 0;
fetch('news.json?v='+Date.now()).then(r=>r.json()).then(data=>{
let n = data[id];
let paras = n.description.split('\n').map(p=>`<p>${p}</p>`).join('');
document.getElementById('detail').innerHTML = `<h1>${n.title}</h1><p style="color:gray"><b>By ${n.author} | ${n.date}</b></p><img src="${n.image}"><div>${paras}</div>`;
});
</script>
</body>
</html>
