<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Pillar News - Latest News</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}.header{background:#b30000;color:#fff;padding:15px;text-align:center}.container{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;padding:15px}.card{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.1)}.card img{width:100%;height:180px;object-fit:cover}.card h3{padding:10px;margin:0;font-size:16px}.card p{padding:0 10px 10px;color:#666;font-size:13px}</style>
</head>
<body>
<div class="header"><h1>4th Pillar News</h1><a href="news.html" style="color:#fff">All News</a></div>
<div class="container" id="news-container"></div>
<script>
fetch('news.json').then(r=>r.json()).then(data=>{
  let latest = data.slice(0,12); // HOME PE SIRF 12 LATEST
  let html = '';
  latest.forEach(n=>{
    html += `<div class="card" onclick="window.location='article.html?id=${n.id}'"><img src="${n.image}"><h3>${n.title}</h3><p>${n.category} | ${n.date}</p></div>`;
  });
  document.getElementById('news-container').innerHTML = html;
});
</script>
</body>
</html>
