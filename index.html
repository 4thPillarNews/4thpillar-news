<div style="text-align:center;padding:10px;background:#fff">
<button onclick="filterNews('All')">All</button>
<button onclick="filterNews('National')">National</button>
<button onclick="filterNews('International')">International</button>
<button onclick="filterNews('Sports')">Sports</button>
<button onclick="filterNews('Ghaziabad')">Ghaziabad</button>
</div>
<script>
function filterNews(cat){
fetch('news.json').then(r=>r.json()).then(data=>{
let f = cat=='All' ? data : data.filter(n=>n.category==cat);
// wahi card wala code yahan use kar
})
}
</script>
