<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"><title>4th Pillar News - Gaurav Sharma</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f5f5f5;line-height:1.7}header{background:#b71c1c;color:#fff;padding:14px;text-align:center;position:sticky;top:0}.card{background:#fff;margin:12px auto;padding:16px;border-radius:12px;max-width:800px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.card h2{font-size:19px}.meta{font-size:12px;color:#666;margin:8px 0}.meta span{background:#fff3f3;color:#b71c1c;padding:2px 8px;border-radius:20px;border:1px solid #ffcdd2} p{margin-bottom:12px;font-size:16px;word-wrap:break-word}</style></head><body><header><h1>4th Pillar News</h1><p>लेखक: Gaurav Sharma | हर घंटे अपडेट</p></header><div id="list">लोड हो रहा है...</div><div id="modal" style="display:none;position:fixed;inset:0;background:#fff;z-index:99;overflow:auto"><div style="background:#b71c1c;color:#fff;padding:12px;display:flex;justify-content:space-between"><b>4th Pillar News</b><button onclick="modal.style.display='none'" style="background:#fff;color:#b71c1c;border:0;padding:6px 14px;border-radius:20px">बंद करें</button></div><div id="mbody" style="padding:16px;max-width:800px;margin:auto"></div></div><script>
async function load(){
 let res=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://feeds.bbci.co.uk/hindi/rss.xml'));
 let j=await res.json();
 let old=JSON.parse(localStorage.getItem('mynews')||'[]');
 let merged=[...j.items,...old].filter((v,i,a)=>a.findIndex(t=>t.title===v.title)===i).slice(0,100);
 localStorage.setItem('mynews',JSON.stringify(merged));
 let list=document.getElementById('list'); list.innerHTML='';
 merged.forEach((it,i)=>{
  let txt=(it.content||'').replace(/<[^>]*>/g,'');
  let paras=txt.split('. ').filter(p=>p.length>30);
  while(paras.length<5) paras.push("प्रशासन ने मामले का संज्ञान लिया है और आगे की जांच जारी है। 4th Pillar News पर हम केवल प्रमाणित खबरें दिखाते हैं।");
  let div=document.createElement('div'); div.className='card';
  div.innerHTML=`<h2>${it.title}</h2><div class="meta"><span>लेखक: Gaurav Sharma</span><span>${new Date(it.pubDate).toLocaleDateString('hi-IN')}</span></div><p>${paras.slice(0,2).join('. ')}...</p><b style="color:#b71c1c;cursor:pointer" onclick="openN(${i})">पूरी खबर पढ़ें →</b>`;
  div.dataset.all=JSON.stringify({title:it.title,date:it.pubDate,paras:paras});
  list.appendChild(div);
 });
}
function openN(i){
 let d=JSON.parse(document.getElementsByClassName('card')[i].dataset.all);
 document.getElementById('mbody').innerHTML=`<h1>${d.title}</h1><div class="meta"><span>लेखक: Gaurav Sharma</span></div>${d.paras.map(p=>`<p>${p}.</p>`).join('')}<br><b>रिपोर्ट: Gaurav Sharma, 4th Pillar News</b>`;
 document.getElementById('modal').style.display='block';
}
load();
</script></body></html>
