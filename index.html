<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Pillar News - Gaurav Sharma</title>
<style>
  body{margin:0;font-family:Arial;background:#f5f5f5}
  .topbar{background:#b80000;color:#fff;padding:6px;text-align:center;font-size:14px}
  header{background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
  header img{height:50px;background:#fff;padding:4px;border-radius:4px}
  .newsbox{background:#fff;max-width:800px;margin:20px auto;padding:20px;border-radius:8px}
</style>
</head>
<body>
<div class="topbar" id="datebar"></div>
<header>
  <div style="display:flex;align-items:center;gap:12px">
    <img src="logo.png" alt="Logo">
    <h2 style="margin:0">4TH PILLAR NEWS</h2>
  </div>
  <div>Reporter: Gaurav Sharma</div>
</header>
<div class="newsbox">
  <h1>Breaking: 4th Pillar News Live Ho Gayi</h1>
  <p>Ghaziabad se Gaurav Sharma ki report - Site ka header aur logo fix ho gaya hai.</p>
</div>
<script>
  const d=new Date().toLocaleDateString('hi-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('datebar').innerText=d + " | Ghaziabad, UP";
</script>
</body>
</html>
