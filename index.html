<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4th Pillar News</title>
<style>body{margin:0;font-family:Arial;background:#f2f2f2}.top{background:#b30000;padding:10px 15px;display:flex;align-items:center;gap:10px}.top img{height:36px;width:36px;border-radius:50%;background:#fff}.top a{color:#fff;text-decoration:none;font-weight:bold;font-size:19px}.grid{max-width:800px;margin:auto;padding:10px;display:grid;gap:12px}.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 5px #0002}.card img{width:100%;height:200px;object-fit:cover}.card.t{padding:10px;font-weight:bold;font-size:17px;color:#222}.card.m{padding:0 10px 10px;color:#666;font-size:13px}</style></head>
<body>
<div class="top"><img src="logo.png" onerror="this.src='https://via.placeholder.com/36'"><a href="index.html">4th Pillar News</a></div>
<div class="grid" id="g"></div>
<script>
fetch('news.json?v='+Date.now()).then(r=>r.json()).then(list=>{
 document.getElementById('g').innerHTML=list.map(n=>`
  <a href="${n.link}" style="text-decoration:none"><div class="card"><img src="${n.image}"><div class="t">${n.title}</div><div class="m">By ${n.reporter} | ${n.date}</div></div></a>
 `).join('');
});
</script></body></html>
