<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Pillar News</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f5f5;line-height:2;color:#111}
.top{background:#0b2047;display:flex;align-items:center;padding:10px 14px;gap:12px;position:sticky;top:0;z-index:10}
.top img{width:52px;height:52px;border-radius:10px;background:#fff}
.top h1{color:#fff;font-size:18px}
.card{background:#fff;margin:12px auto;padding:18px;border-radius:12px;max-width:800px}
.meta span{background:#fff3f3;color:#b71c1c;padding:3px 10px;border-radius:20px;border:1px solid #ffcdd2;font-size:12px}
#modal{display:none;position:fixed;inset:0;background:#fff;z-index:100;overflow:auto}
#mhead{background:#0b2047;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0}
#mbody{padding:22px;max-width:800px;margin:auto}
#mbody p{margin-bottom:18px;font-size:18px;text-align:justify}
</style>
</head>
<body>
<div class="top">
<img src="the4thpillarnews.jpg">
<h1>The Fourth Pillar News</h1>
</div>
<div id="list"><p style="text-align:center;padding:40px">खबर लाई जा रही है...</p></div>
<div id="modal"><div id="mhead"><b>4th Pillar News</b><button onclick="modal.style.display='none'" style="background:#fff;color:#0b2047;border:0;padding:6px 14px;border-radius:20px;font-weight:bold">बंद करें ✕</button></div><div id="mbody"></div></div>

<script>
let newsList=[];
async function loadDirect(){
try{
let proxy=`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.bbc.com/hindi')}`;
let res=await fetch(proxy);
let data=await res.json();
let doc=new DOMParser().parseFromString(data.contents,'text/html');
let links=[...doc.querySelectorAll('a[href*="/hindi/articles/"]')];
let map=new Map();
links.forEach(a=>{
 let href=a.href.startsWith('http')?a.href:'https://www.bbc.com'+a.getAttribute('href');
 let title=a.innerText.trim();
 if(title.length>20 && title.length<150 &&!map.has(href) &&!title.toLowerCase().includes('bbc')){
   map.set(href,title);
 }
});
newsList=[...map.entries()].slice(0,15).map(([link,title])=>({link,title}));
let list=document.getElementById('list'); list.innerHTML='';
newsList.forEach((it,i)=>{
 let d=document.createElement('div'); d.className='card';
 d.innerHTML=`<h2>${it.title}</h2><div class="meta"><span>लेखक: Gaurav Sharma</span></div><p style="color:#b71c1c;font-weight:bold;margin-top:8px">पूरी खबर पढ़ें →</p>`;
 d.onclick=()=>openDirect(i);
 list.appendChild(d);
});
}catch(e){ document.getElementById('list').innerHTML=`<p style="text-align:center;padding:40px">Fail - Retry</p>`; }
}

async function openDirect(i){
let it=newsList[i];
let body=document.getElementById('mbody');
document.getElementById('modal').style.display='block';
body.innerHTML=`<h1>${it.title}</h1><p>पूरा आर्टिकल लाया जा रहा है...</p>`;
try{
let proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(it.link)}`;
let res=await fetch(proxy);
let data=await res.json();
let doc=new DOMParser().parseFromString(data.contents,'text/html');
let paras=[...doc.querySelectorAll('main p, article p, div[data-component="text-block"] p')].map(p=>p.innerText.trim()).filter(t=>t.length>50 &&!t.toLowerCase().includes('bbc') &&!t.includes('फॉलो'));
paras=[...new Set(paras)];

// ===== TERA LOGIC YAHAN HAI =====
 // 1. RE-ARRANGE - Google ko lage naya hai - 1,0,2,4,3,5
 let arranged = paras.length>=6? [paras[1],paras[0],paras[2],paras[4],paras[3],paras[5]] : paras;
 arranged = arranged.slice(0,6);
 // 2. HALKA RE-WRITE - Copy safe
 arranged = arranged.map(p=>p.replace('ने कहा','ने बताया').replace('के अनुसार','के मुताबिक').replace('बताया गया','जानकारी दी गई'));
// ===============================

body.innerHTML=`
<h1>${it.title}</h1>
<div class="meta"><span>लेखक: Gaurav Sharma</span><span>4th Pillar News</span></div>
${arranged.map(p=>`<p>${p}</p>`).join('')}
<br><p><b>रिपोर्ट: Gaurav Sharma, 4th Pillar News</b></p>
`;
}catch(err){ body.innerHTML=`<h1>${it.title}</h1><p>Load fail</p>`; }
}
loadDirect();
</script>
</body>
</html>
