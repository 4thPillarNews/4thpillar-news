<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4th Pillar News</title>
<style>
body{font-family:system-ui;max-width:900px;margin:auto;padding:10px;background:#f2f2f2}
.card{background:#fff;border-radius:12px;overflow:hidden;margin:14px 0;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:210px;object-fit:cover}
.c{padding:14px}
h3{margin:5px 0;font-size:18px}
.btn{background:#d32f2f;color:#fff;padding:9px 14px;border-radius:6px;text-decoration:none;display:inline-block;margin-top:8px;margin-right:6px}
.btn2{background:#222}
</style>
</head>
<body>
<h2 style="text-align:center">4th Pillar - ताज़ा खबर</h2>
<div id="list">Loading...</div>
<script>
fetch('news.json?v='+Date.now()).then(r=>r.json()).then(data=>{
let h='';
data.forEach((n,i)=>{
h+=`<div class="card"><img src="${n.image}"><div class="c"><h3>${n.title}</h3><small>${n.date}</small><p>${n.description.slice(0,100)}...</p><a class="btn" href="article.html?id=${i}">पढ़ें</a><a class="btn btn2" href="${n.link}" target="_blank">Original</a></div></div>`;
});
document.getElementById('list').innerHTML=h;
});
</script>
</body>
</html>
