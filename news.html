<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Detail</title>
<style>
body{margin:0;font-family:system-ui;background:#fff}
.top{background:#0b2047;color:#fff;padding:12px;display:flex;align-items:center;gap:12px;position:sticky;top:0}
.top a{color:#fff;text-decoration:none;font-size:22px}
.wrap{max-width:760px;margin:auto;padding:16px}
.wrap img{width:100%;height:240px;object-fit:cover;border-radius:12px;margin:12px 0}
h1{font-size:21px;line-height:1.4}
.badge{background:#eef2ff;color:#1e3a8a;padding:4px 10px;border-radius:20px;font-size:11px}
.meta{font-size:12px;color:#666;background:#f5f7f9;padding:8px 10px;border-radius:8px;margin:10px 0}
p{font-size:16.5px;line-height:1.9;margin:14px 0;text-align:justify}
</style>
</head>
<body>
<div class="top"><a href="index.html">←</a><b>The Fourth Pillar News</b></div>
<div class="wrap" id="detail">लोड हो रहा है...</div>
<script>
(async()=>{
 let id=new URLSearchParams(location.search).get('id');
 let box=document.getElementById('detail');
 try{
  let r=await fetch('./news.json?v='+Date.now());
  let data=await r.json();
  let n=data.find(x=> String(x.id)===String(id));
  if(!n) n=data[Number(id)||0];
  if(!n){ box.innerHTML='Khabar nahi mili'; return; }
  let paras='';
  for(let i=1;i<=8;i++){ if(n['para'+i]) paras+=`<p>${n['para'+i]}</p>`; }
  if(!paras) paras=`<p>${n.content||''}</p>${n.link?`<p><a href="${n.link}" target="_blank">Original Source पढ़ें</a></p>`:''}`;
  box.innerHTML=`
    <span class="badge">${n.category||'News'}</span>
    <h1>${n.title}</h1>
    <div class="meta">📅 ${n.date||''} • ✍️ ${n.reporter||'Gaurav Sharma'} • 📍 ${n.location||'Ghaziabad'}</div>
    <img src="${n.image||n.img||''}" onerror="this.src='https://picsum.photos/seed/4pillar/800/500'">
    ${paras}
    <br><a href="index.html" style="background:#0b2047;color:#fff;padding:10px 18px;border-radius:20px;text-decoration:none;display:inline-block">← सभी खबरें</a>
  `;
 }catch(e){ box.innerHTML='Error: '+e.message; }
})();
</script>
</body>
</html>
