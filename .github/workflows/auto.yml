name: Auto News Update
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install libraries
        run: pip install feedparser requests beautifulsoup4 lxml
      
      - name: Run news script
        run: python news.py
      
      - name: Commit and Push
        run: |
          git config --global user.name "4thPillarBot"
          git config --global user.email "bot@4thpillar.news"
          git add news.json
          git diff --staged --quiet || git commit -m "auto: update news with real images"
          git push
