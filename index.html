<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Detail</title>
<style>body{font-family:sans-serif;padding:15px;line-height:1.6;max-width:700px;margin:auto} img{width:100%;border-radius:10px} h1{font-size:24px}</style>
</head>
<body>
<a href="index.html" style="text-decoration:none">← Back to Home</a>
<div id="detail">Loading news...</div>

<script>
async function loadNews(){
  let params = new URLSearchParams(window.location.search);
  let id = params.get('id');
  console.log("ID:", id);
  
  // GitHub pages pe cache issue isliye ?v=Date
  let res = await fetch('news.json?v=' + Date.now());
  let allNews = await res.json();
  
  let n = allNews.find(x => String(x.id) === String(id));
  
  if(!n){
    document.getElementById('detail').innerHTML = "News nahi mili. ID: " + id + "<br>news.json check kar.";
    return;
  }
  
  document.getElementById('detail').innerHTML = `
    <h1>${n.title}</h1>
    <small>By ${n.author || '4th Pillar News'} | ${n.time || ''}</small>
    <br><br>
    <img src="${n.img}" onerror="this.src='https://via.placeholder.com/600'">
    <p style="font-size:18px;white-space:pre-wrap;">${n.content || n.description || 'Content khali hai, fetch-news.js me content ka field check kar.'}</p>
  `;
}
loadNews();
</script>
</body>
</html>
