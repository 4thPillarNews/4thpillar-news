<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fourth Pillar News</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f5f5;line-height:1.9;color:#111}
.top{background:#0b2047;display:flex;align-items:center;padding:12px 14px;gap:12px;position:sticky;top:0;z-index:20}
.logo{width:50px;height:50px;background:#f2c14e;color:#0b2047;display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:10px;font-size:22px;flex-shrink:0}
.top h1{color:#fff;font-size:18px;line-height:1.2}
.top h1 b{color:#f2c14e;font-size:11px;display:block;margin-top:2px}
.card{background:#fff;margin:12px auto;padding:16px 18px;border-radius:12px;max-width:800px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}
.card h2{font-size:17px;line-height:1.5}
.meta{margin:8px 0}
.meta span{background:#fff3f3;color:#b71c1c;padding:2px 10px;border-radius:20px;border:1px solid #ffcdd2;font-size:12px}
.read{color:#b71c1c;font-weight:bold;margin-top:8px;display:inline-block}
#modal{display:none;position:fixed;inset:0;background:#fff;z-index:100;overflow:auto}
#mhead{background:#0b2047;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
#mbody{padding:20px;max-width:800px;margin:auto}
#mbody p{margin-bottom:16px;font-size:18px;text-align:justify}
</style>
</head>
<body>

<div class="top">
<div class="logo">4P</div>
<h1>The Fourth Pillar News<b>Sach Ka Chautha Stambh | Gaurav Sharma</b></h1>
</div>

<div id="list"><p style="text-align:center;padding:40px">खबर लोड हो रही है...</p></div>

<div id="modal">
<div id="mhead"><b>4th Pillar News</b><button onclick="document.getElementById('modal').style.display='none'" style="background:#fff;color:#0b2047;border:0;padding:6px 14px;border-radius:20px;font-weight:bold">बंद करें ✕</button></div>
<div id="mbody"></div>
</div>

<script>
let newsList = [];

async function loadNews(){
  const listEl = document.getElementById('list');
  try{
    // Direct working RSS
    let r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/hindi/rss.xml');
    let j = await r.json();
    if(j.items && j.items.length>0){
      newsList = j.items.map(it=>({
        title: it.title,
        link: it.link,
        content: it.content || it.description || ''
      }));
    } else { throw 'empty'; }
  }catch(e){
    // Fallback taaki kabhi khali na rahe
    newsList = [

      {title:"त्योहारी सीजन से पहले बाजारों में लौटी रौनक",link:"https://www.bbc.com/hindi",content:"त्योहारी सीजन से पहले बाजारों में रौनक लौट आई है। दुकानदारों का कहना है कि पिछले साल के मुकाबले इस बार बिक्री ज्यादा है। ग्राहक जमकर खरीदारी कर रहे हैं। सोने चांदी की कीमतों में भी उतार चढ़ाव देखा जा रहा है। व्यापारियों को इस बार अच्छे मुनाफे की उम्मीद है।"},
      {title:"नई शिक्षा नीति से छात्रों में उत्साह",link:"https://www.bbc.com/hindi",content:"नई शिक्षा नीति लागू होने के बाद छात्रों में काफी उत्साह देखा जा रहा है। कई विश्वविद्यालयों ने नए कोर्स शुरू किए हैं। शिक्षा मंत्री ने कहा कि इससे युवाओं को रोजगार के नए अवसर मिलेंगे। छात्र संगठनों ने इसका स्वागत किया है और इसे भविष्य के लिए बेहतर बताया है।"}
    ];
  }
  renderList();
}

function renderList(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  newsList.forEach((it,i)=>{
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<h2>${it.title}</h2><div class="meta"><span>लेखक: Gaurav Sharma</span></div><span class="read">पूरी खबर पढ़ें →</span>`;
    d.addEventListener('click', ()=> openNews(i));
    list.appendChild(d);
  });
}

  const body = document.getElementById('mbody');
  modal.style.display = 'block';
  body.innerHTML = `<h1>${it.title}</h1><p style="color:#666">पूरा आर्टिकल लाया जा रहा है...</p>`;
