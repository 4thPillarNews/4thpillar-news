<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 4th Pillar News</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#000;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.container{max-width:800px;margin:20px auto;padding:10px}
.card{background:#fff;padding:15px;margin-bottom:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,.1);cursor:pointer}
.card h2{margin:0 0 10px 0;font-size:18px;color:#000}
#details{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;padding:20px;overflow:auto;display:none;z-index:100}
#details button{padding:10px 20px;background:#000;color:#fff;border:0;border-radius:5px;margin-bottom:20px}
</style>
</head>
<body>
<header>THE 4TH PILLAR NEWS</header>
<div class="container" id="news-container">Loading...</div>
<div id="details"></div>
<script>
let allNews=[];
fetch('news.json?v='+Date.now()).then(r=>r.json()).then(news=>{
  allNews=news;
  let html="";
  for(let i=0;i<news.length;i++){
    html+=`<div class="card" onclick="openNews(${i})"><h2>${news[i].title}</h2><p>${news[i].desc.substring(0,100)}... [Padhe]</p><small>By ${news[i].author} | ${news[i].date}</small></div>`;
  }
  document.getElementById('news-container').innerHTML=html;
});
function openNews(i){
  let n=allNews[i];
  document.getElementById('details').innerHTML=`<button onclick="document.getElementById('details').style.display='none'">← Wapas</button><h1>${n.title}</h1><small>By ${n.author} | ${n.date}</small><p style="margin-top:20px;font-size:17px;line-height:1.6;">${n.desc}</p>`;
  document.getElementById('details').style.display='block';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
