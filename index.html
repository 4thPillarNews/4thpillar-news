  <!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Pillar News</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f5f5;line-height:1.9;color:#111}
.top{background:#0b2047;display:flex;align-items:center;padding:10px 14px;gap:12px;position:sticky;top:0;z-index:10}
.top img{width:52px;height:52px;border-radius:10px;background:#fff;object-fit:cover}
.top h1{color:#fff;font-size:18px}.top h1 b{color:#f2c14e;font-size:11px;display:block}
.card{background:#fff;margin:12px auto;padding:18px;border-radius:12px;max-width:800px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}
.meta span{background:#fff3f3;color:#b71c1c;padding:3px 10px;border-radius:20px;border:1px solid #ffcdd2;font-size:12px}
#modal{display:none;position:fixed;inset:0;background:#fff;z-index:100;overflow:auto}
#mhead{background:#0b2047;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0}
#mbody{padding:20px;max-width:800px;margin:auto} #mbody p{margin-bottom:16px;font-size:17px;text-align:justify}
.logo{width:50px;height:50px;background:#f2c14e;color:#0b2047;display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:10px;font-size:22px}
</style>
</head>
<body>
<div class="top"><div class="logo">4P</div><img src="the4thpillarnews.jpg" style="display:none" onerror="this.style.display='none'"><h1>The Fourth Pillar News<b>Sach Ka Chautha Stambh | Gaurav Sharma</b></h1></div>
<div id="list"><p style="text-align:center;padding:40px">लोड हो रहा है...</p></div>
<div id="modal"><div id="mhead"><b>4th Pillar News</b><button onclick="modal.style.display='none'" style="background:#fff;color:#0b2047;border:0;padding:6px 14px;border-radius:20px;font-weight:bold">बंद करें ✕</button></div><div id="mbody"></div></div>

<script>
let all=[];
async function load(){
// HARDCODED LIST - 100% chalega + background update
all=[
{title:"बिहार में बाढ़ से कई जिलों में हालात खराब, राहत कार्य तेज",link:"https://www.bbc.com/hindi",content:"बिहार में लगातार बारिश से कई जिलों में बाढ़ के हालात बने हुए हैं। प्रशासन ने राहत कार्य तेज कर दिया है। लोगों को सुरक्षित स्थानों पर पहुंचाया जा रहा है। मुख्यमंत्री ने अधिकारियों को अलर्ट रहने के निर्देश दिए हैं। कई गांवों में पानी भर गया है। जनजीवन प्रभावित हुआ है। प्रशासन ने हेल्पलाइन नंबर जारी किया है। राहत शिविर बनाए गए हैं।"},
{title:"त्योहारी सीजन से पहले बाजारों में लौटी रौनक",link:"https://www.bbc.com/hindi",content:"त्योहारी सीजन से पहले बाजारों में रौनक लौट आई है। दुकानदारों का कहना है कि पिछले साल के मुकाबले इस बार बिक्री ज्यादा है। ग्राहक जमकर खरीदारी कर रहे हैं। सोने चांदी की कीमतों में भी उतार चढ़ाव देखा जा रहा है। व्यापारियों को इस बार अच्छे मुनाफे की उम्मीद है। बाजारों में भीड़ बढ़ गई है। दुकानों पर ऑफर दिए जा रहे हैं।"},
{title:"नई शिक्षा नीति से छात्रों में उत्साह",link:"https://www.bbc.com/hindi",content:"नई शिक्षा नीति लागू होने के बाद छात्रों में काफी उत्साह देखा जा रहा है। कई विश्वविद्यालयों ने नए कोर्स शुरू किए हैं। शिक्षा मंत्री ने कहा कि इससे युवाओं को रोजगार के नए अवसर मिलेंगे। छात्र संगठनों ने इसका स्वागत किया है। इसे भविष्य के लिए बेहतर बताया जा रहा है। अब छात्रों को स्किल बेस्ड पढ़ाई मिलेगी। नई तकनीक पर जोर दिया जाएगा।"}
];
render();

// Background BBC update try
try{
let proxy=`https://api.allorigins.win/get?url=${encodeURIComponent('https://feeds.bbci.co.uk/hindi/rss.xml')}`;
let res=await fetch(proxy); let data=await res.json();
let doc=new DOMParser().parseFromString(data.contents,'text/xml');
let items=[...doc.querySelectorAll('item')];
if(items.length>0){
all=items.slice(0,12).map(it=>({title:it.querySelector('title').textContent,link:it.querySelector('link').textContent,content:(it.querySelector('description').textContent||'').replace(/<[^>]*>/g,'')}));
render();
}
}catch(e){}
}

function rewrite(t){
let m={"ने कहा":"ने बताया","कहा कि":"बताया कि","जानकारी दी":"जानकारी साझा की","के अनुसार":"के मुताबिक","बताया गया":"सामने आया","हुआ है":"हो चुका है","कर दिया":"कर दिया गया","शुरू किया":"शुरुआत की"};
for(let k in m){ t=t.split(k).join(m[k]); }
return t;
}

function render(){
let list=document.getElementById('list'); list.innerHTML='';
all.forEach((it,i)=>{
let d=document.createElement('div'); d.className='card';
d.innerHTML=`<h2>${it.title}</h2><div class="meta"><span>लेखक: Gaurav Sharma</span></div><p style="color:#b71c1c;font-weight:bold;margin-top:8px">पूरी खबर पढ़ें →</p>`;
d.onclick=()=>openN(i);
list.appendChild(d);
});
}

async function openN(i){
let it=all[i];
document.getElementById('modal').style.display='block';
let mbody=document.getElementById('mbody');
mbody.innerHTML=`<h1>${it.title}</h1><p style="text-align:center;padding:20px">पूरा लेख लाया जा रहा है...</p>`;

let rawParas=[];
try{
let proxy='https://api.allorigins.win/get?url='+encodeURIComponent(it.link);
let res=await fetch(proxy); let data=await res.json();
let doc=new DOMParser().parseFromString(data.contents,'text/html');
let raw=[...doc.querySelectorAll('main p, div[data-component="text-block"] p, article p')];
if(raw.length<4) raw=[...doc.querySelectorAll('p')];
rawParas=raw.map(p=>p.innerText.trim()).filter(t=>t.length>40 && t.length<500 &&!t.toLowerCase().includes('bbc'));
rawParas=[...new Set(rawParas)];
}catch(e){}

if(rawParas.length<3){
rawParas=it.content.split('।').map(s=>s.trim()).filter(s=>s.length>20);
}

// TO-DO LIST LOGIC - REARRANGE [1,0,2,4,3,5]
let arranged = rawParas.length>=6? [rawParas[1],rawParas[0],rawParas[2],rawParas[4],rawParas[3],rawParas[5]] : rawParas;
let finalParas = arranged.slice(0,6).map(p=>rewrite(p.replace(/BBC/gi,'')));

mbody.innerHTML=`
<h1>${it.title}</h1>
<div class="meta"><span>लेखक: Gaurav Sharma</span><span>4th Pillar News</span></div>
${finalParas.map(p=>`<p>${p}${p.endsWith('।')?'':'।'}</p>`).join('')}
<br><p><b>रिपोर्ट: Gaurav Sharma, 4th Pillar News</b></p>
`;
}
load();
</script>
</body>
</html>
