<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News</title><style>body{margin:0;font-family:Arial}.top{background:#b30000;padding:12px}.top a{color:#fff;text-decoration:none}.box{max-width:700px;margin:auto;padding:15px}.box img{width:100%;border-radius:8px}</style></head><body><div class="top"><a href="index.html">← Back</a></div><div class="box" id="d">Loading...</div><script>let id=parseInt(new URLSearchParams(location.search).get('id')||0);fetch('news.json?v='+Date.now()).then(r=>r.json()).then(a=>{let n=a.find(x=>x.id==id)||a[0];document.getElementById('d').innerHTML=`<h1>${n.title}</h1><p style=color:gray>${n.date} | ${n.reporter}</p><img src=${n.image}><p>${n.para1}</p><p>${n.para2}</p><p>${n.para3}</p><p>${n.para4}</p><a href=${n.link} target=_blank style=color:#b30000>Original Source</a>`})</script></body></html>
